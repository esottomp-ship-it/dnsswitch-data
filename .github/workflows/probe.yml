name: Probe Zattoo page (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch page
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          curl -sSL -A "$UA" -H "Accept-Language: en" -D headers.txt -o page.html -w "%{http_code} %{size_download}\n" https://zattoo.com/ch/en/channels | tee status.txt
      - name: Save to probe branch
        run: |
          cd out
          git init -q -b probe && git add . 
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
