name: Update Zattoo Switzerland channels

# Every Monday (and on demand from the Actions tab), refreshes zattoo_ch.txt
# from https://zattoo.com/ch/en/channels. Commits only when the list changes.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh channel list
        run: python3 scripts/zattoo.py
      - name: Commit if changed
        run: |
          git add -N zattoo_ch.txt 2>/dev/null || true
          if git diff --quiet -- zattoo_ch.txt; then
            echo "Nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add zattoo_ch.txt
          git commit -m "Zattoo Switzerland channels: $(grep -vc '^#' zattoo_ch.txt) channels"
          git push
